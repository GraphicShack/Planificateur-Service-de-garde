name: Vérifier et construire macOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tests, application native et image disque réelle
        id: build
        # Artifact suffix is detected from the actual Python architecture.
        # No universal/Intel/Apple Silicon compatibility is assumed by label.
        env:
          PLANIFICATEUR_BUILD_PYTHON: python
        run: bash scripts/build-macos.sh
      - name: Livrer le DMG vérifié et ses comptes rendus
        uses: actions/upload-artifact@v4
        with:
          name: Planificateur-SDG-macOS-${{ steps.build.outputs.architecture }}
          if-no-files-found: error
          path: |
            dist/macos/*.dmg
            dist/verification-macos/*.json
