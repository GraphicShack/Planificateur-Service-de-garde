name: Vérifier et construire Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tests et logiciel portable sans installation
        # No Inno Setup or system installation in the default pipeline.
        # The staged folder and the extracted ZIP must both confirm portable data.
        run: .\scripts\build-windows.ps1 -UseCurrentPython
      - name: Livrer le ZIP portable vérifié et ses comptes rendus
        uses: actions/upload-artifact@v4
        with:
          name: Planificateur-SDG-Portable-Windows
          if-no-files-found: error
          path: |
            dist/Planificateur-SDG-Portable.zip
            dist/verification/*.json
