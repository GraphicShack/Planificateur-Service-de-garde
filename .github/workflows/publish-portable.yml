name: Publier les téléchargements portables
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Vérifier et construire Windows', 'Vérifier et construire macOS']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publication-portable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le contrôle des fichiers à publier
        run: python -m unittest discover -s scripts -p test_prepare_release.py -v
      - name: Trouver les deux constructions réussies du même code
        id: builds
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const requested = context.payload.workflow_run?.head_sha;
            const runs = async (workflow_id) => (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id, branch: 'main', event: 'push', status: 'success', per_page: 100
            })).data.workflow_runs.filter(r => r.head_repository?.full_name === `${repo.owner}/${repo.repo}`);
            const windows = await runs('build-windows.yml');
            const macos = await runs('build-macos.yml');
            const win = windows.find(w => (!requested || w.head_sha === requested) && macos.some(m => m.head_sha === w.head_sha));
            if (!win) {
              core.notice('Publication en attente des deux constructions réussies du même code.');
              core.setOutput('ready', 'false');
              return;
            }
            const mac = macos.find(m => m.head_sha === win.head_sha);
            const file = await github.rest.repos.getContent({...repo, path: 'pyproject.toml', ref: win.head_sha});
            const version = Buffer.from(file.data.content, 'base64').toString().match(/^version = "(\d+\.\d+\.\d+)"$/m)?.[1];
            if (!version) throw new Error('Version du code testé introuvable.');
            try {
              const release = (await github.rest.repos.getReleaseByTag({...repo, tag: `v${version}`})).data;
              if (release.target_commitish !== win.head_sha) throw new Error('Cette version est déjà publiée pour un autre code : augmentez la version.');
              if (!release.draft) {
                core.notice(`Version ${version} déjà publiée.`);
                core.setOutput('ready', 'false');
                return;
              }
            } catch (error) { if (error.status !== 404) throw error; }
            for (const [key, value] of Object.entries({ready: 'true', windows: win.id, macos: mac.id, sha: win.head_sha, version})) core.setOutput(key, value);
      - uses: actions/download-artifact@v4
        if: steps.builds.outputs.ready == 'true'
        with:
          name: Planificateur-SDG-Portable-Windows
          run-id: ${{ steps.builds.outputs.windows }}
          github-token: ${{ github.token }}
          path: release-input/windows
      - uses: actions/download-artifact@v4
        if: steps.builds.outputs.ready == 'true'
        with:
          name: Planificateur-SDG-Portable-macOS-arm64
          run-id: ${{ steps.builds.outputs.macos }}
          github-token: ${{ github.token }}
          path: release-input/macos
      - name: Contrôler les rapports et préparer les ZIP publics
        if: steps.builds.outputs.ready == 'true'
        env:
          RELEASE_VERSION: ${{ steps.builds.outputs.version }}
        run: python scripts/prepare_release.py release-input release-output "$RELEASE_VERSION"
      - name: Publier les fichiers sans connexion GitHub requise
        if: steps.builds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.builds.outputs.version }}
          RELEASE_SHA: ${{ steps.builds.outputs.sha }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows }}
          MACOS_RUN: ${{ steps.builds.outputs.macos }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          Path('release-notes.md').write_text(
              'Logiciel portable en français, entièrement hors ligne. Aucun installateur ni Python requis.\n\n'
              '- **Windows 64 bits** : téléchargez le ZIP Windows.\n'
              '- **Mac Apple Silicon, macOS 15 ou plus récent** : téléchargez le ZIP macOS-arm64.\n\n'
              'Décompressez le dossier complet dans un emplacement où vous pouvez enregistrer des fichiers, '
              'puis ouvrez Planificateur-SDG.exe ou Planificateur-SDG.app. Gardez tous les fichiers ensemble. '
              'Vos données restent dans le sous-dossier donnees.\n\n'
              '**Mise à jour** : fermez le logiciel, sauvegardez votre ancien dossier donnees, '
              'puis transférez ce dossier dans la nouvelle version extraite. Ne le remplacez pas par un dossier vide.\n\n'
              'Les ZIP proviennent des constructions natives réussies du même code. '
              'Leurs contrôles confirment le mode portable, SQLite, les PDF et le solveur après extraction.\n\n'
              f"[Contrôle Windows](https://github.com/{repo}/actions/runs/{os.environ['WINDOWS_RUN']}) · "
              f"[Contrôle Mac](https://github.com/{repo}/actions/runs/{os.environ['MACOS_RUN']})\n\n"
              'Le fichier SHA256SUMS permet de vérifier les téléchargements.\n', encoding='utf-8')
          PY
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_SHA" --draft --title "Planificateur — Service de garde $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "v$RELEASE_VERSION" release-output/* --clobber
          gh release edit "v$RELEASE_VERSION" --draft=false --latest --notes-file release-notes.md
