name: Publier les téléchargements portables
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'SHA complet du code testé et approuvé pour publication'
        type: string
        required: true
      publish:
        description: 'Publier uniquement après accord explicite du responsable du projet'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_run:
    workflows: ['Vérifier et construire Windows', 'Vérifier et construire macOS']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publication-portable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le contrôle des fichiers à publier
        run: python -m unittest discover -s scripts -p test_prepare_release.py -v
      - name: Trouver les deux constructions réussies du même code
        id: builds
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const fs = require('fs');
            const approval = JSON.parse(fs.readFileSync('.github/release-request.json', 'utf8'));
            const requested = context.eventName === 'workflow_dispatch' ? context.payload.inputs?.commit : approval.commit;
            if (!/^[0-9a-f]{40}$/.test(requested || '') || (context.eventName !== 'workflow_dispatch' && approval.approved !== true)) {
              core.setOutput('ready', 'false');
              return;
            }
            if (context.eventName === 'workflow_run' && context.payload.workflow_run.head_sha !== requested) {
              core.setOutput('ready', 'false');
              return;
            }
            const runs = async (workflow_id) => (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id, branch: 'main', event: 'push', status: 'success', per_page: 100
            })).data.workflow_runs.filter(r => r.head_repository?.full_name === `${repo.owner}/${repo.repo}`);
            const windows = await runs('build-windows.yml');
            const macos = await runs('build-macos.yml');
            const win = windows.find(w => (w.head_sha === requested) && macos.some(m => m.head_sha === w.head_sha));
            if (!win) {
              core.notice('Publication en attente des deux constructions réussies du même code.');
              core.setOutput('ready', 'false');
              return;
            }
            const mac = macos.find(m => m.head_sha === win.head_sha);
            const file = await github.rest.repos.getContent({...repo, path: 'pyproject.toml', ref: win.head_sha});
            const version = Buffer.from(file.data.content, 'base64').toString().match(/^version = "(\d+\.\d+\.\d+)"$/m)?.[1];
            if (!version) throw new Error('Version du code testé introuvable.');
            try {
              const release = (await github.rest.repos.getReleaseByTag({...repo, tag: `v${version}`})).data;
              if (release.target_commitish !== win.head_sha) throw new Error('Cette version est déjà publiée pour un autre code : augmentez la version.');
              if (!release.draft) {
                core.notice(`Version ${version} déjà publiée.`);
                core.setOutput('ready', 'false');
                return;
              }
            } catch (error) { if (error.status !== 404) throw error; }
            for (const [key, value] of Object.entries({ready: 'true', windows: win.id, macos: mac.id, sha: win.head_sha, version})) core.setOutput(key, value);
      - uses: actions/download-artifact@v4
        if: steps.builds.outputs.ready == 'true'
        with:
          name: Planificateur-SDG-Portable-Windows
          run-id: ${{ steps.builds.outputs.windows }}
          github-token: ${{ github.token }}
          path: release-input/windows
      - uses: actions/download-artifact@v4
        if: steps.builds.outputs.ready == 'true'
        with:
          name: Planificateur-SDG-Portable-macOS-arm64
          run-id: ${{ steps.builds.outputs.macos }}
          github-token: ${{ github.token }}
          path: release-input/macos
      - name: Contrôler les rapports et préparer les ZIP publics
        if: steps.builds.outputs.ready == 'true'
        env:
          RELEASE_VERSION: ${{ steps.builds.outputs.version }}
        run: python scripts/prepare_release.py release-input release-output "$RELEASE_VERSION"
      - name: Publier les fichiers sans connexion GitHub requise
        if: steps.builds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.builds.outputs.version }}
          RELEASE_SHA: ${{ steps.builds.outputs.sha }}
          WINDOWS_RUN: ${{ steps.builds.outputs.windows }}
          MACOS_RUN: ${{ steps.builds.outputs.macos }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import hashlib
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          sample = Path('release-output/Horaire-pedagogique-exemple.pdf')
          shutil.copyfile('docs/exemple-horaire-pedagogique.pdf', sample)
          with Path('release-output/SHA256SUMS.txt').open('a', encoding='utf-8') as handle:
              handle.write(hashlib.sha256(sample.read_bytes()).hexdigest() + '  ' + sample.name + '\n')
          Path('release-notes.md').write_text(
              'Planification d’une journée pédagogique à la fois, avec une interface épurée.\n\n'
              '- Effectif global du service, sans groupes dans l’interface ; minimum de deux éducatrices et ratio configurable, initialement 1/20.\n'
              '- Couverture verticale alignée sur les heures, plages identiques fusionnées, pauses exclues ; comptes explicites et alertes sélectionnables. La bande Ratio peut être fermée et reste absente du PDF.\n'
              '- Colonnes de toutes les éducatrices sans défilement horizontal ; noms à 14 px, heures à 13 px et en-têtes compactés.\n'
              '- Quarts aux couleurs des éducatrices, pauses et dîner avec rémunération exacte, poignées toujours visibles et édition au clavier.\n'
              '- Annuler/Rétablir sur cinquante actions, nom de journée en place, champ de date simple et indicateur unique de sauvegarde.\n'
              '- Dossier déplacé dans la barre latérale ; commandes et présentation simplifiées.\n'
              '- Ajout et modification des profils dans une seule fenêtre claire, sans onglets, avec textes lisibles et sections adaptées aux petits écrans.\n'
              '- Boutons Aujourd’hui retirés de la barre principale et du sélecteur de date.\n'
              '- Couleur distincte par éducatrice ; prochain rang libre de 1 à 11, rangs intermédiaires libres et refus des doublons.\n'
              '- Un seul PDF lettre paysage selon le modèle fourni : huit éducateurs par page, grille 6 h 50–17 h 35 et interruptions vides.\n'
              '- Journées, heures, statuts et archives indépendants ; anciennes données préservées avec copie de sécurité.\n\n'
              'Logiciel portable en français, entièrement hors ligne. Aucun installateur ni Python requis.\n\n'
              '- **Windows 64 bits** : téléchargez le ZIP Windows.\n'
              '- **Mac Apple Silicon, macOS 15 ou plus récent** : téléchargez le ZIP macOS-arm64.\n\n'
              'Décompressez le dossier complet dans un emplacement où vous pouvez enregistrer des fichiers, '
              'puis ouvrez Planificateur-SDG.exe ou Planificateur-SDG.app. Gardez tous les fichiers ensemble. '
              'Vos données restent dans le sous-dossier donnees.\n\n'
              '**Mac** : si macOS lance une copie temporaire, le logiciel retrouve le dossier portable '
              'd’origine ou vous demande de le sélectionner. Choisissez le dossier extrait qui contient '
              'Planificateur-SDG.app et portable.mode.\n\n'
              '**Mise à jour** : fermez le logiciel, sauvegardez votre ancien dossier donnees, '
              'puis transférez ce dossier dans la nouvelle version extraite. Ne le remplacez pas par un dossier vide.\n\n'
              'Les ZIP proviennent des constructions natives réussies du même code. '
              'Leurs contrôles confirment le mode portable, SQLite, les PDF et le solveur après extraction.\n\n'
              f"[Contrôle Windows](https://github.com/{repo}/actions/runs/{os.environ['WINDOWS_RUN']}) · "
              f"[Contrôle Mac](https://github.com/{repo}/actions/runs/{os.environ['MACOS_RUN']})\n\n"
              'Le fichier SHA256SUMS permet de vérifier les téléchargements.\n', encoding='utf-8')
          PY
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_SHA" --draft --title "Planificateur — Service de garde $RELEASE_VERSION" --notes-file release-notes.md
          fi
          gh release upload "v$RELEASE_VERSION" release-output/* --clobber
          gh release edit "v$RELEASE_VERSION" --draft=false --latest --notes-file release-notes.md
