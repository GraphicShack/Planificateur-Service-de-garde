[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gardeplan"
version = "0.2.2"
description = "Planification locale du service de garde scolaire, à la minute"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "ortools>=9.11,<10", "reportlab>=4.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7", "pypdf>=5,<7"]

[project.gui-scripts]
gardeplan = "gardeplan.app:main"

[tool.setuptools.packages.find]
include = ["gardeplan*"]

[tool.setuptools.package-data]
gardeplan = ["assets/*.svg", "assets/*.png", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
