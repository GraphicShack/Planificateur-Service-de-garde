<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="304" viewBox="0 0 1000 304" role="img" aria-labelledby="title description">
  <title id="title">SDG — Planificateur de service de garde</title>
  <desc id="description">Bannière vert forêt avec le sigle SDG et un calendrier dessinés en caractères ASCII. Une journée. Une équipe. Un horaire clair.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12392E"/>
      <stop offset="1" stop-color="#214F3F"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="302" rx="24" fill="url(#forest)" stroke="#44715F"/>
  <path d="M615 40V264" stroke="#507C68"/>
  <text x="46" y="43" fill="#C4DDCD" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">PLANIFICATEUR / SERVICE DE GARDE</text>
  <text x="150" y="90" fill="#F4F8F1" font-family="monospace" font-size="30" xml:space="preserve"> ____  ____   ____</text>
  <text x="150" y="119" fill="#F4F8F1" font-family="monospace" font-size="30" xml:space="preserve">/ ___||  _ \ / ___|</text>
  <text x="150" y="148" fill="#F4F8F1" font-family="monospace" font-size="30" xml:space="preserve">\___ \| | | | |  _</text>
  <text x="150" y="177" fill="#F4F8F1" font-family="monospace" font-size="30" xml:space="preserve"> ___) | |_| | |_| |</text>
  <text x="150" y="206" fill="#F4F8F1" font-family="monospace" font-size="30" xml:space="preserve">|____/|____/ \____|</text>
  <text x="46" y="252" fill="#F4F8F1" font-family="Arial, sans-serif" font-size="21" font-weight="600">Une journée. Une équipe. Un horaire clair.</text>
